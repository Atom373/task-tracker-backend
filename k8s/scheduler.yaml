apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: docker.io/atom373/task-tracker-scheduler:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: rabbitmq-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo 'ready'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo 'alive'"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: task-tracker
spec:
  selector:
    app: scheduler
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP